<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>MUST VPN Router · 设置</title>
<style>
:root{color-scheme:light;font-family:"Segoe UI","Microsoft YaHei",system-ui,sans-serif;color:#1c293c;background:#f3f5f9}
*{box-sizing:border-box}body{margin:0}main{max-width:780px;margin:40px auto;padding:0 24px 32px}.top{display:flex;align-items:center;gap:12px;margin-bottom:26px}.mark{display:grid;place-items:center;width:42px;height:42px;border-radius:12px;background:#225dd5;color:#fff;font-size:23px;font-weight:700}.brand{font-size:14px;color:#506079;font-weight:600}h1{font-size:27px;letter-spacing:-.6px;margin:4px 0}h2{font-size:17px;margin:0 0 15px}.status{margin-left:auto;padding:7px 11px;border-radius:20px;background:#e7ecf3;color:#526078;font-size:12px}.status.on{background:#e2f4ea;color:#17683c}.card{padding:24px;border:1px solid #e1e6ef;border-radius:16px;background:#fff;margin-bottom:18px;box-shadow:0 3px 12px #1c293c04}.hint{color:#61718a;font-size:13px;line-height:1.7;margin:7px 0 0}.choices{display:grid;gap:10px}.option{cursor:pointer;display:flex;gap:12px;padding:15px;border:1px solid #dce3ee;border-radius:10px;align-items:flex-start}.option:has(input:checked){border-color:#346ce2;background:#f2f6ff;box-shadow:0 0 0 1px #346ce2}.option input{margin-top:4px;accent-color:#255ed4;width:16px;height:16px;flex-shrink:0}.option strong{font-size:14px;font-weight:600}.option small{display:block;color:#65748b;font-size:12px;margin-top:5px;line-height:1.6}.recommended{font-size:11px;color:#235cce;margin-left:8px;background:#e1eaff;padding:2px 6px;border-radius:4px}.domain-block{margin-top:18px}label.field{display:block;font-size:13px;font-weight:600;margin-bottom:8px}textarea,input[type=number],input[type=text]{font:inherit;font-size:14px;width:100%;border:1px solid #cad4e3;border-radius:8px;padding:11px;background:#fff;color:#1c293c}textarea{height:106px;resize:vertical;line-height:1.6}input:focus,textarea:focus,button:focus-visible{outline:3px solid #bed2ff;outline-offset:2px}.switch{display:flex;align-items:flex-start;gap:11px;cursor:pointer;font-size:14px;font-weight:600}.switch input{width:17px;height:17px;accent-color:#255ed4;margin-top:2px}.fields{display:grid;grid-template-columns:1fr 1fr;gap:20px;margin-top:20px}.disabled{opacity:.5}.note{margin-top:18px;border-radius:9px;padding:11px 13px;background:#f4f7fc;color:#52627c;font-size:12px;line-height:1.7}.footer{display:flex;align-items:center;gap:10px}button{font:inherit;font-size:14px;font-weight:600;border-radius:9px;padding:11px 19px;cursor:pointer;border:1px solid #cfdae9;background:#fff;color:#45566e}button.primary{background:#225dd5;border-color:#225dd5;color:#fff}button:disabled{opacity:.55;cursor:wait}#message{font-size:13px;line-height:1.7;margin:15px 0;min-height:22px}#message.success{color:#17683c}#message.error{color:#b32136}.privacy{font-size:12px;color:#74829a;margin-top:24px;text-align:center}.hidden{display:none}@media(max-width:580px){main{margin:22px auto;padding:0 14px}.card{padding:18px}.top{flex-wrap:wrap}.status{margin-left:54px}.fields{grid-template-columns:1fr}.footer{flex-wrap:wrap}}
</style>
</head>
<body><main>
<header class="top"><div class="mark" aria-hidden="true">M</div><div><div class="brand">MUST VPN Router</div><h1>连接设置</h1></div><span id="status" class="status">正在读取状态…</span></header>
<form id="settings">
<section class="card"><h2>哪些流量经过虚拟机？</h2><div class="choices">
<label class="option"><input type="radio" name="mode" value="ssh"><span><strong>仅代理 SSH</strong><small>AISC 的 SSH 经过 VPN，网页使用本机正常网络。</small></span></label>
<label class="option"><input type="radio" name="mode" value="all"><span><strong>AISC 的 SSH 和 Web 都代理</strong><span class="recommended">默认</span><small>AISC 经过 VPN，普通学校网站仍然直连优先。</small></span></label>
<label class="option"><input type="radio" name="mode" value="domains"><span><strong>只代理指定域名</strong><small>列表中的域名及其子域名经过 VPN，其他地址直接连接。</small></span></label>
</div><div id="domains-block" class="domain-block hidden"><label class="field" for="domains">需要代理的域名</label><textarea id="domains" spellcheck="false" placeholder="aisc.must.edu.mo"></textarea><p class="hint">每行一个裸域名，不要填写 https://、路径或 *.。直接使用 IP 的 SSH 别名不匹配域名规则。</p></div></section>
<section class="card"><h2>学校连接回退</h2><label id="fallback-label" class="switch"><input id="fallback" type="checkbox"><span>直连失败后，尝试通过虚拟机 VPN 连接</span></label><p id="fallback-hint" class="hint">仅在服务器已启动且 VPN 就绪时尝试；打开设置不会启动虚拟机。</p><div class="fields"><div><label class="field" for="timeout">直连等待时间（秒）</label><input id="timeout" type="number" min="0.1" max="60" step="0.1" required></div><div><label class="field" for="ports">SSH 端口</label><input id="ports" type="text" inputmode="numeric" placeholder="22" required><p class="hint">多个端口用逗号分隔，例如 22, 2222。</p></div></div><div class="note">网页分流使用 <strong>must-router web</strong> 打开的浏览器，或手动设置了 PAC 的浏览器。保存后请重启 Router，并重新打开分流浏览器。</div></section>
<div class="footer"><button id="save" class="primary" type="submit" disabled>保存设置</button><button id="reload" type="button">重新读取</button><button id="close" type="button">关闭设置</button></div><div id="message" role="status" aria-live="polite">正在读取设置…</div>
</form><p class="privacy">设置只保存在本机的 Router 独立目录，原版 MUST VPN VM 保持独立。</p>
</main>
<script>
const $=id=>document.getElementById(id), token=location.pathname.split('/')[1];
let loaded=false, busy=false, closed=false;
function message(text,kind=''){$('message').textContent=text;$('message').className=kind;}
function mode(){return document.querySelector('input[name="mode"]:checked')?.value;}
function sync(){const domains=mode()==='domains';$('domains-block').classList.toggle('hidden',!domains);$('fallback').disabled=domains;$('fallback-label').classList.toggle('disabled',domains);$('fallback-hint').textContent=domains?'指定域名模式只处理列表中的地址，不使用学校自动回退。':'仅在服务器已启动且 VPN 就绪时尝试；打开设置不会启动虚拟机。';}
async function api(path,body){const options=body===undefined?{}:{method:'POST',headers:{'Content-Type':'application/json','X-Router-Settings':token},body:JSON.stringify(body)};let response;try{response=await fetch('api/'+path,options);}catch{throw new Error('设置服务已关闭。请重新打开桌面的设置快捷方式。');}const data=await response.json();if(!response.ok)throw new Error(data.error||'操作失败，请重试。');return data;}
async function load(){try{const data=await api('settings'),p=data.policy;document.querySelector('input[value="'+p.traffic_mode+'"]').checked=true;$('domains').value=p.proxy_domains.join('\n');$('fallback').checked=p.fallback;$('timeout').value=p.direct_timeout;$('ports').value=p.ssh_ports.join(', ');$('status').textContent=data.server_ready?'服务器和 VPN 已就绪':'服务器关闭或 VPN 未就绪';$('status').classList.toggle('on',data.server_ready);loaded=true;$('save').disabled=false;sync();message('设置已读取。');}catch(e){message(e.message,'error');}}
$('settings').addEventListener('change',event=>{if(event.target.name==='mode')sync();if(loaded)message('有未保存的更改。');});
$('settings').addEventListener('input',()=>{if(loaded)message('有未保存的更改。');});
$('settings').addEventListener('submit',async event=>{event.preventDefault();if(!loaded||busy)return;busy=true;$('save').disabled=true;try{const parts=$('ports').value.split(/[,，\s]+/).filter(Boolean);if(!parts.every(p=>/^\d+$/.test(p)))throw new Error('SSH 端口应填写整数，多个端口用逗号分隔。');const data=await api('settings',{traffic_mode:mode(),proxy_domains:$('domains').value.split(/[\n,，]+/).map(s=>s.trim()).filter(Boolean),fallback:$('fallback').checked,direct_timeout:Number($('timeout').value),ssh_ports:parts.map(Number)});message(data.message,'success');}catch(e){message(e.message,'error');}finally{busy=false;$('save').disabled=closed;}});
$('reload').addEventListener('click',()=>{if(!busy)load();});
$('close').addEventListener('click',async()=>{if(busy)return;try{await api('close',{});closed=true;document.querySelectorAll('input,textarea,button').forEach(el=>el.disabled=true);message('设置已关闭，可以关闭此页面。');$('status').textContent='设置服务已关闭';}catch(e){message(e.message,'error');}});
setInterval(()=>{if(!closed)api('ping').catch(()=>{});},15000);
load();
</script></body></html>
